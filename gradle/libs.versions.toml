[versions]
kotlin = "2.4.10"
kotlinx-serialization-json = "1.11.0"
ktfmt-gradle = "0.26.0"
postgres = "42.7.13"
logback = "1.5.35"
exposed = "1.3.1"
jbrcrypt = "0.4"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json"  }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgres" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
jbcrypt = { group = "org.mindrot", name = "jbcrypt", version.ref = "jbrcrypt" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktfmt-gradle = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt-gradle" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
exposed = { id = "org.jetbrains.exposed.plugin", version.ref = "exposed" }